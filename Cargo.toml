[workspace]
members = ["gui"]

[package]
name = "swiss"
version = "0.2.1"
edition = "2021"
description = "One small binary, three small jobs: unlock what's holding a file, wrangle PDFs, and build a full web branding set from one image."
license = "MIT"
repository = "https://github.com/not6741lol/swiss"
homepage = "https://not6741.lol"
readme = "README.md"
keywords = ["cli", "pdf", "favicon", "utility", "windows"]
categories = ["command-line-utilities"]

[[bin]]
name = "swiss"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fontdue = "0.9.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
lopdf = { version = "0.45.0", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# `opt-level = "z"` makes egui's per-frame layout noticeably sluggish, so the hot
# crates get real optimisation. Only swiss-gui links them, so the CLI's size is
# unaffected by these.
[profile.release.package.egui]
opt-level = 3

[profile.release.package.epaint]
opt-level = 3

[profile.release.package.ecolor]
opt-level = 3

[profile.release.package.emath]
opt-level = 3

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_RestartManager", "Win32_System_Threading"] }
